name: iOS build

on:
  push:
    paths:
      - "native-ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "native-ios/**"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build CANVAULT for iOS Simulator
        run: >-
          xcodebuild
          -project native-ios/CANVAULT.xcodeproj
          -scheme CANVAULT
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
